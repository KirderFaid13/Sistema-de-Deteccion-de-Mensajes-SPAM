<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Detector de spam SMS{% endblock %} · Grupo 03 UPN</title>
<link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
<header>
  <div class="marca">
    <span class="marca-icono">✦</span>
    <div><h1>Detector de spam SMS</h1><span class="submarca">Grupo 03 · UPN</span></div>
  </div>
  <nav>
    <a href="{{ url_for('inicio') }}" class="{{ 'activo' if request.endpoint in ('inicio','clasificar_mensaje') }}">Clasificar</a>
    <a href="{{ url_for('pendientes') }}" class="{{ 'activo' if request.endpoint=='pendientes' }}">Bandeja de revisión</a>
    <a href="{{ url_for('revisiones') }}" class="{{ 'activo' if request.endpoint=='revisiones' }}">Revisiones</a>
    <a href="{{ url_for('historial') }}" class="{{ 'activo' if request.endpoint=='historial' }}">Historial</a>
    <a href="{{ url_for('estudio.inicio') }}" class="{{ 'activo' if request.blueprint=='estudio' }}">Prueba con revisores</a>
  </nav>
</header>
<main>{% block contenido %}{% endblock %}</main>
</body>
</html>
